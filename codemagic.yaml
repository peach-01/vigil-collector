workflows:
  vigil_ios_release:
    name: Vigil iOS TestFlight Build
    max_build_duration: 30

    integrations:
      app_store_connect: vigil-collect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ardentis.vigilCollector

      #vars:
        #BUNDLE_ID: com.ardentis.vigilCollector

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      # ------------------------------------------------
      # CODE SIGNING
      # ------------------------------------------------
      - name: Setup Code Signing
        script: |
          echo "BOOT_TRACE: Code signing profiles"
          xcode-project use-profiles

      # ------------------------------------------------
      # CLEAN + DEPENDENCIES
      # ------------------------------------------------
      - name: Clean Flutter
        script: |
          echo "BOOT_TRACE: flutter clean"
          flutter clean

      - name: Install Flutter Dependencies
        script: |
          echo "BOOT_TRACE: flutter pub get"
          flutter pub get

      #- name: Flutter Precache iOS
        #script: |
          #echo "BOOT_TRACE: flutter precache"
          #flutter precache --ios

      # ------------------------------------------------
      # COCOAPODS INSTALL
      # ------------------------------------------------
      - name: Clean CocoaPods
        script: |
          echo "BOOT_TRACE: Cleaning pods"
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Podfile.lock

      #- name: Install CocoaPods
        script: |
          echo "=============================="
          echo "BOOT_TRACE: COCOAPODS INSTALL"
          echo "=============================="
          cd ios
          pod install --repo-update --clean-install
          cd ..

      #- name: Boot Trace — Pods
        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: POD STRUCTURE"
          #echo "=============================="
          #ls -la ios/Pods
          #ls -la ios/Pods/Target\ Support\ Files || true

      # ------------------------------------------------
      # VERIFY PLIST
      # ------------------------------------------------
      - name: Verify GoogleService-Info.plist
        script: |
          echo "BOOT_TRACE: Checking GoogleService-Info.plist"
          if [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "BOOT_TRACE: GoogleService-Info.plist FOUND"
          else
            echo "BOOT_TRACE ERROR: GoogleService-Info.plist MISSING"
            exit 1
          fi

      - name: Ensure Firebase plist in build
        script: |
          echo "BOOT_TRACE: Copy Firebase plist"
          cp ios/Runner/GoogleService-Info.plist ios/GoogleService-Info.plist

      # ------------------------------------------------
      # BUILD iOS ARCHIVE
      # ------------------------------------------------
      - name: Build iOS Archive
        script: |
          echo "=============================="
          echo "BOOT_TRACE: FLUTTER BUILD iOS"
          echo "=============================="

          flutter build ios \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

      # ------------------------------------------------
      # EXPORT IPA
      # ------------------------------------------------
      - name: Export IPA
        script: |
          echo "BOOT_TRACE: Building IPA"
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

      # ------------------------------------------------
      # ARCHIVE INSPECTION
      # ------------------------------------------------
      #- name: Boot Trace — Archive Structure
        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: ARCHIVE CONTENTS"
          #echo "=============================="
          #ls -R build/ios/archive || true

      # ------------------------------------------------
      # IPA INSPECTION
      # ------------------------------------------------
      - name: Boot Trace — IPA Contents
        script: |
          "=============================="
          echo "BOOT_TRACE: IPA CONTENTS"
          echo "=============================="
          unzip -l build/ios/ipa/*.ipa | head -200 || true

      #- name: Boot Trace — Flutter Engine Check
        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: FLUTTER ENGINE"
          #echo "=============================="
          #unzip -l build/ios/ipa/*.ipa | grep Flutter || true
          #unzip -l build/ios/ipa/*.ipa | grep App.framework || true
          #unzip -l build/ios/ipa/*.ipa | grep flutter_assets || true

    artifacts:
      - build/ios/ipa/*.ipa
      #- build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true