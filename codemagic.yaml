        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: FLUTTER CONFIG"
          #echo "=============================="
          #ls -la ios/Flutter
          #if [ -f ios/Flutter/Generated.xcconfig ]; then
            #echo "BOOT_TRACE: Generated.xcconfig"
            #cat ios/Flutter/Generated.xcconfig
          #fi

