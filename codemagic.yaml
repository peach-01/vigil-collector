      # ------------------------------------------------
      - name: Build IPA (Verbose)
        script: |
          echo "=============================="
          echo "BOOT_TRACE: FLUTTER BUILD IPA"
          echo "=============================="

          flutter build ipa \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

