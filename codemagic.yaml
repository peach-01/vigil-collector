workflows:
  vigil_ios_release:
    name: Vigil iOS TestFlight Build
    max_build_duration: 30

    integrations:
      app_store_connect: vigil-collector-beta

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ardentis.vigilCollector

      vars:
        BUNDLE_ID: com.ardentis.vigilCollector

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData

    scripts:
      - name: Flutter clean
        script: |
          flutter clean

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Flutter precache
        script: |
          flutter precache --ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Export Mapping
        script: |
          flutter build ipa --export-options-plist=/Users/builder/export_options.plist

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-method=app-store \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true