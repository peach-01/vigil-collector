workflows:
  vigil_ios_release:
    name: Vigil iOS TestFlight Build
    max_build_duration: 30

    integrations:
      app_store_connect: vigil-collect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ardentis.vigilCollector

      #vars:
        #BUNDLE_ID: com.ardentis.vigilCollector

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:

      # ------------------------------------------------
      # ENVIRONMENT DIAGNOSTICS
      # ------------------------------------------------
      #- name: Boot Trace — Environment
        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: ENVIRONMENT"
          #echo "=============================="
          #flutter --version
          #dart --version
          #xcodebuild -version
          #sw_vers
          #pwd
          #env | sort

      # ------------------------------------------------
      # PROJECT STRUCTURE
      # ------------------------------------------------
      #- name: Boot Trace — Project Structure
        #script: |
          #echo "=============================="
          #echo "BOOT_TRACE: PROJECT STRUCTURE"
          #echo "=============================="
          #ls -la
          #ls -la ios
          #ls -la ios/Runner

      # ------------------------------------------------
      # CLEAN + DEPENDENCIES
      # ------------------------------------------------
      - name: Clean Flutter
        script: |
          echo "BOOT_TRACE: flutter clean"
          flutter clean

      - name: Install Flutter Dependencies
        script: |
          echo "BOOT_TRACE: flutter pub get"
          flutter pub get

      #- name: Flutter Precache iOS
        #script: |
          #echo "BOOT_TRACE: flutter precache"
          #flutter precache --ios

      # ------------------------------------------------
