workflows:
  vigil_ios_release:
    name: Vigil iOS TestFlight Build
    max_build_duration: 30

    integrations:
      app_store_connect: vigil-collect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ardentis.vigilCollector

      vars:
        BUNDLE_ID: com.ardentis.vigilCollector

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Flutter version
        script: flutter --version

      - name: Clean build
        script: |
          flutter clean
          flutter pub get

      - name: Flutter precache
        script: flutter precache --ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update --verbose
          cd ..

      - name: Disable analytics
        script: flutter config --no-analytics

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-codesign

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true