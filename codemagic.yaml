workflows:
  vigil_ios_release:
    name: Vigil iOS TestFlight Build
    max_build_duration: 30

    integrations:
      app_store_connect: vigil-collector-beta

    environment:
      flutter: stable

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ardentis.vigilCollector

      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Flutter clean
        script: |
          flutter clean
          flutter pub cache repair

      - name: Install dependencies
        script: flutter pub get

      - name: Flutter precache
        script: flutter precache --ios

      - name: Ensure podhelper.rb exists
        script: |
          cd ios
          if [ ! -f Flutter/podhelper.rb ]; then
            echo "podhelper.rb not found, generating..."
            mkdir -p Flutter
            cat <<EOT > Flutter/podhelper.rb
# Auto-generated podhelper.rb
platform :ios, '12.0'

# CocoaPods integration for Flutter
use_frameworks!
use_modular_headers!

def flutter_install_all_ios_pods(flutter_application_path)
  pod 'Flutter', :path => File.join(flutter_application_path, 'Flutter')
end
EOT
            echo "podhelper.rb generated successfully."
          else
            echo "podhelper.rb exists, skipping generation."
          fi
          cd ..

      - name: Clean & install iOS pods
        script: |
          cd ios
          rm -rf Pods
          rm Podfile.lock
          # Ensure CocoaPods repo is updated and podhelper.rb exists
          pod repo update
          if [ ! -f Flutter/podhelper.rb ]; then
            echo "Error: podhelper.rb is missing in ios/Flutter"
            exit 1
          fi
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-method=app-store \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true